# Render "Blueprint" — optional. Creates the web service from this repo.
# The database is NOT created here (Render's free Postgres expires after 30 days);
# create a free Neon database instead and paste its URL as DATABASE_URL. See DEPLOYMENT.md.
services:
  - type: web
    name: projectpulse
    runtime: node
    plan: free
    buildCommand: npm --prefix server ci
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # you paste the Neon connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render generates a random secret
      - key: ENABLE_DEMO_LOGIN
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
