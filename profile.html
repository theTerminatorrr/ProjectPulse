<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — ProjectPulse</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="app-body" data-page="profile">

  <aside class="sidebar" id="sidebar">
    <a href="dashboard.html" class="brand"><i class="fa-solid fa-diagram-project"></i><span>ProjectPulse</span></a>
    <nav class="sidebar-nav" aria-label="Main navigation">
      <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a>
      <a href="projects.html" class="nav-item"><i class="fa-solid fa-folder-open"></i><span>Projects</span></a>
      <a href="tasks.html" class="nav-item"><i class="fa-solid fa-table-columns"></i><span>Tasks</span></a>
      <a href="team.html" class="nav-item" data-role-visible="leader"><i class="fa-solid fa-people-group"></i><span>Team</span></a>
      <a href="messages.html" class="nav-item"><i class="fa-solid fa-message"></i><span>Messages</span></a>
      <a href="feedback.html" class="nav-item"><i class="fa-solid fa-comments"></i><span>Feedback</span></a>
      <a href="calendar.html" class="nav-item"><i class="fa-solid fa-calendar-days"></i><span>Calendar</span></a>
      <a href="reports.html" class="nav-item"><i class="fa-solid fa-chart-line"></i><span>Reports</span></a>
      <a href="admin.html" class="nav-item" data-role-visible="admin"><i class="fa-solid fa-user-shield"></i><span>Admin</span></a>
    </nav>
    <div class="sidebar-footer">
      <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
      <button class="nav-item nav-item-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></button>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
      <div class="topbar-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="globalSearch" placeholder="Search..." />
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="notifBell" aria-label="Notifications"><i class="fa-solid fa-bell"></i><span class="badge-dot" id="notifCount">0</span></button>
        <div class="notif-dropdown" id="notifDropdown" hidden>
          <div class="notif-dropdown-header"><h4>Notifications</h4><button class="link-btn" id="clearAllNotifs">Clear all</button></div>
          <ul class="notif-list" id="notifList"></ul>
        </div>
        <div class="profile-menu">
          <button class="profile-trigger" id="profileTrigger">
            <img src="images/avatar-placeholder.png" alt="" class="avatar-sm" id="topbarAvatar" />
            <span id="topbarUserName">Loading…</span>
            <i class="fa-solid fa-chevron-down"></i>
          </button>
          <div class="profile-dropdown" id="profileDropdown" hidden>
            <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
            <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
            <button id="profileLogoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
          </div>
        </div>
      </div>
    </header>

    <main class="page-content">
      <div class="page-header">
        <div>
          <h1>Profile</h1>
          <p class="text-muted">Manage your personal information.</p>
        </div>
      </div>

      <div class="profile-grid">
        <div class="glass-card profile-card">
          <div class="avatar-upload">
            <img src="images/avatar-placeholder.png" alt="" id="profileAvatarPreview" class="avatar-xl" />
            <label class="btn btn-outline btn-sm" for="avatarUploadInput">
              <i class="fa-solid fa-camera"></i> Change Photo
            </label>
            <input type="file" id="avatarUploadInput" accept="image/*" hidden />
          </div>
          <h3 id="profileCardName">Loading…</h3>
          <span class="badge" id="profileCardRole">Role</span>
          <p class="text-muted" id="profileCardEmail"></p>
          <div class="profile-stats-row">
            <div><strong id="profileStatProjects">0</strong><span>Projects</span></div>
            <div><strong id="profileStatTasks">0</strong><span>Tasks</span></div>
          </div>
        </div>

        <div class="glass-card">
          <h3>Personal Information</h3>
          <form id="profileForm" class="app-form">
            <div class="form-grid-2">
              <div class="form-group">
                <label for="profileFullName">Full Name</label>
                <input type="text" id="profileFullName" required />
              </div>
              <div class="form-group">
                <label for="profileStudentId">Student ID</label>
                <input type="text" id="profileStudentId" />
              </div>
            </div>
            <div class="form-group">
              <label for="profileEmail">Email</label>
              <input type="email" id="profileEmail" required />
            </div>
            <div class="form-grid-2">
              <div class="form-group">
                <label for="profileDepartment">Department</label>
                <input type="text" id="profileDepartment" />
              </div>
              <div class="form-group">
                <label for="profileSemester">Semester</label>
                <input type="text" id="profileSemester" />
              </div>
            </div>
            <div class="form-group">
              <label for="profileBio">Bio</label>
              <textarea id="profileBio" rows="3" placeholder="A short line about yourself"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </form>
        </div>

        <div class="glass-card">
          <h3>Change Password</h3>
          <form id="changePasswordForm" class="app-form">
            <div class="form-group">
              <label for="currentPassword">Current Password</label>
              <input type="password" id="currentPassword" required />
            </div>
            <div class="form-grid-2">
              <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required />
              </div>
              <div class="form-group">
                <label for="confirmNewPassword">Confirm New Password</label>
                <input type="password" id="confirmNewPassword" required />
              </div>
            </div>
            <button type="submit" class="btn btn-outline">Update Password</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="js/data/storage.js"></script>
  <script src="js/data/seed.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
