<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — ProjectPulse</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="app-body" data-page="reports">

  <aside class="sidebar" id="sidebar">
    <a href="dashboard.html" class="brand"><i class="fa-solid fa-diagram-project"></i><span>ProjectPulse</span></a>
    <nav class="sidebar-nav" aria-label="Main navigation">
      <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a>
      <a href="projects.html" class="nav-item"><i class="fa-solid fa-folder-open"></i><span>Projects</span></a>
      <a href="tasks.html" class="nav-item"><i class="fa-solid fa-table-columns"></i><span>Tasks</span></a>
      <a href="team.html" class="nav-item" data-role-visible="leader"><i class="fa-solid fa-people-group"></i><span>Team</span></a>
      <a href="messages.html" class="nav-item"><i class="fa-solid fa-message"></i><span>Messages</span></a>
      <a href="feedback.html" class="nav-item"><i class="fa-solid fa-comments"></i><span>Feedback</span></a>
      <a href="calendar.html" class="nav-item"><i class="fa-solid fa-calendar-days"></i><span>Calendar</span></a>
      <a href="reports.html" class="nav-item active"><i class="fa-solid fa-chart-line"></i><span>Reports</span></a>
      <a href="admin.html" class="nav-item" data-role-visible="admin"><i class="fa-solid fa-user-shield"></i><span>Admin</span></a>
    </nav>
    <div class="sidebar-footer">
      <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
      <button class="nav-item nav-item-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></button>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
      <div class="topbar-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="globalSearch" placeholder="Search..." />
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="notifBell" aria-label="Notifications"><i class="fa-solid fa-bell"></i><span class="badge-dot" id="notifCount">0</span></button>
        <div class="notif-dropdown" id="notifDropdown" hidden>
          <div class="notif-dropdown-header"><h4>Notifications</h4><button class="link-btn" id="clearAllNotifs">Clear all</button></div>
          <ul class="notif-list" id="notifList"></ul>
        </div>
        <div class="profile-menu">
          <button class="profile-trigger" id="profileTrigger">
            <img src="images/avatar-placeholder.png" alt="" class="avatar-sm" id="topbarAvatar" />
            <span id="topbarUserName">Loading…</span>
            <i class="fa-solid fa-chevron-down"></i>
          </button>
          <div class="profile-dropdown" id="profileDropdown" hidden>
            <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
            <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
            <button id="profileLogoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
          </div>
        </div>
      </div>
    </header>

    <main class="page-content" id="reportsPrintArea">
      <div class="page-header no-print">
        <div>
          <h1>Reports</h1>
          <p class="text-muted">Generate a summary you can print or export.</p>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-outline" id="printReportBtn"><i class="fa-solid fa-print"></i> Print</button>
          <button class="btn btn-primary" id="exportJsonBtn"><i class="fa-solid fa-file-export"></i> Export JSON</button>
        </div>
      </div>

      <div class="toolbar glass-card no-print">
        <div class="toolbar-filters">
          <select id="reportTypeSelect" aria-label="Report type">
            <option value="project">Project Report</option>
            <option value="member">Member Report</option>
            <option value="task">Task Report</option>
            <option value="feedback">Teacher Feedback Report</option>
            <option value="activity">Activity Log</option>
          </select>
          <select id="reportProjectSelect" aria-label="Select project"><option value="">All projects</option></select>
        </div>
      </div>

      <div class="report-body glass-card" id="reportBody">
        <header class="report-print-header">
          <h2 id="reportHeading">Project Summary Report</h2>
          <p class="text-muted" id="reportGeneratedAt"></p>
        </header>

        <div class="stat-grid" id="reportStatGrid"></div>

        <div class="dashboard-grid">
          <div class="glass-card">
            <h3>Status Distribution</h3>
            <canvas id="reportStatusChart"></canvas>
          </div>
          <div class="glass-card">
            <h3>Workload per Member</h3>
            <canvas id="reportWorkloadChart"></canvas>
          </div>
        </div>

        <table class="data-table" id="reportTable">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/data/storage.js"></script>
  <script src="js/data/seed.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</body>
</html>
