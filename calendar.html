<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar — ProjectPulse</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="app-body" data-page="calendar">

  <aside class="sidebar" id="sidebar">
    <a href="dashboard.html" class="brand"><i class="fa-solid fa-diagram-project"></i><span>ProjectPulse</span></a>
    <nav class="sidebar-nav" aria-label="Main navigation">
      <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a>
      <a href="projects.html" class="nav-item"><i class="fa-solid fa-folder-open"></i><span>Projects</span></a>
      <a href="tasks.html" class="nav-item"><i class="fa-solid fa-table-columns"></i><span>Tasks</span></a>
      <a href="team.html" class="nav-item" data-role-visible="leader"><i
          class="fa-solid fa-people-group"></i><span>Team</span></a>
      <a href="messages.html" class="nav-item"><i class="fa-solid fa-message"></i><span>Messages</span></a>
      <a href="feedback.html" class="nav-item"><i class="fa-solid fa-comments"></i><span>Feedback</span></a>
      <a href="calendar.html" class="nav-item active"><i class="fa-solid fa-calendar-days"></i><span>Calendar</span></a>
      <a href="reports.html" class="nav-item"><i class="fa-solid fa-chart-line"></i><span>Reports</span></a>
      <a href="admin.html" class="nav-item" data-role-visible="admin"><i
          class="fa-solid fa-user-shield"></i><span>Admin</span></a>
    </nav>
    <div class="sidebar-footer">
      <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
      <button class="nav-item nav-item-btn" id="logoutBtn"><i
          class="fa-solid fa-right-from-bracket"></i><span>Logout</span></button>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu"><i
          class="fa-solid fa-bars"></i></button>
      <div class="topbar-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="globalSearch" placeholder="Search..." />
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="notifBell" aria-label="Notifications"><i class="fa-solid fa-bell"></i><span
            class="badge-dot" id="notifCount">0</span></button>
        <div class="notif-dropdown" id="notifDropdown" hidden>
          <div class="notif-dropdown-header">
            <h4>Notifications</h4><button class="link-btn" id="clearAllNotifs">Clear all</button>
          </div>
          <ul class="notif-list" id="notifList"></ul>
        </div>
        <div class="profile-menu">
          <button class="profile-trigger" id="profileTrigger">
            <img src="images/avatar-placeholder.png" alt="" class="avatar-sm" id="topbarAvatar" />
            <span id="topbarUserName">Loading…</span>
            <i class="fa-solid fa-chevron-down"></i>
          </button>
          <div class="profile-dropdown" id="profileDropdown" hidden>
            <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
            <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
            <button id="profileLogoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
          </div>
        </div>
      </div>
    </header>

    <main class="page-content">
      <div class="page-header">
        <div>
          <h1>Calendar</h1>
          <p class="text-muted">Deadlines, meetings, and submission dates.</p>
        </div>
        <button class="btn btn-primary" id="openAddEventBtn"><i class="fa-solid fa-plus"></i> Add Event</button>
      </div>

      <div class="calendar-shell glass-card">
        <div class="calendar-nav">
          <button class="icon-btn" id="prevMonthBtn" aria-label="Previous month"><i
              class="fa-solid fa-chevron-left"></i></button>
          <h2 id="calendarMonthLabel">Month Year</h2>
          <button class="icon-btn" id="nextMonthBtn" aria-label="Next month"><i
              class="fa-solid fa-chevron-right"></i></button>
          <button class="btn btn-outline btn-sm" id="todayBtn">Today</button>
        </div>
        <div class="calendar-weekdays">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>

      <div class="glass-card">
        <h3>Upcoming</h3>
        <ul class="simple-list" id="upcomingEventsList"></ul>
      </div>
    </main>
  </div>

  <!-- Add event modal -->
  <div class="modal-overlay" id="addEventModal" hidden>
    <div class="modal glass-card" role="dialog" aria-modal="true" aria-labelledby="addEventTitle">
      <button class="modal-close" data-close-modal="addEventModal" aria-label="Close">&times;</button>
      <h3 id="addEventTitle"><i class="fa-solid fa-calendar-plus"></i> Add Calendar Event</h3>
      <form id="addEventForm" class="app-form">
        <div class="form-group">
          <label for="eventTitle">Title</label>
          <input type="text" id="eventTitle" required placeholder="Sprint review meeting" />
        </div>
        <div class="form-grid-2">
          <div class="form-group">
            <label for="eventDate">Date</label>
            <input type="date" id="eventDate" required />
          </div>
          <div class="form-group">
            <label for="eventType">Type</label>
            <select id="eventType">
              <option value="deadline">Deadline</option>
              <option value="meeting">Meeting</option>
              <option value="presentation">Presentation</option>
              <option value="submission">Submission</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="eventProject">Related Project (optional)</label>
          <select id="eventProject">
            <option value="">— None —</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Add Event</button>
      </form>
    </div>
  </div>

  <script>
    (function () {
      function read(k) { try { return JSON.parse(localStorage.getItem(k) || '[]') || []; } catch (e) { return []; } }

      document.addEventListener('click', function (e) {
        if (!e.target.closest('main')) return;
        var tasks = read('pt_tasks');
        if (!tasks.length) return;

        var el = e.target, hit = null;
        for (var depth = 0; el && el !== document.body && depth < 4 && !hit; depth++, el = el.parentElement) {
          // 1) the entry carries a task id
          var attr = el.getAttribute('data-task-id') || el.getAttribute('data-id');
          if (attr) hit = tasks.find(function (t) { return String(t.id) === String(attr); });
          if (hit) break;
          // 2) otherwise match the entry's text to a task title
          var txt = (el.textContent || '').trim();
          hit = tasks.find(function (t) {
            return t.title && txt.indexOf(t.title) > -1 && txt.length <= t.title.length + 25;
          });
        }
        if (!hit) return; // not a task (custom event, deadline...) -> keep the old behaviour

        e.preventDefault();
        e.stopImmediatePropagation();
        location.href = 'tasks.html?task=' + encodeURIComponent(hit.id);
      }, true);
    })();
  </script>

  <script src="js/data/storage.js"></script>
  <script src="js/data/seed.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
