<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback — ProjectPulse</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="app-body" data-page="feedback">

  <aside class="sidebar" id="sidebar">
    <a href="dashboard.html" class="brand"><i class="fa-solid fa-diagram-project"></i><span>ProjectPulse</span></a>
    <nav class="sidebar-nav" aria-label="Main navigation">
      <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a>
      <a href="projects.html" class="nav-item"><i class="fa-solid fa-folder-open"></i><span>Projects</span></a>
      <a href="tasks.html" class="nav-item"><i class="fa-solid fa-table-columns"></i><span>Tasks</span></a>
      <a href="team.html" class="nav-item" data-role-visible="leader"><i class="fa-solid fa-people-group"></i><span>Team</span></a>
      <a href="messages.html" class="nav-item"><i class="fa-solid fa-message"></i><span>Messages</span></a>
      <a href="feedback.html" class="nav-item active"><i class="fa-solid fa-comments"></i><span>Feedback</span></a>
      <a href="calendar.html" class="nav-item"><i class="fa-solid fa-calendar-days"></i><span>Calendar</span></a>
      <a href="reports.html" class="nav-item"><i class="fa-solid fa-chart-line"></i><span>Reports</span></a>
      <a href="admin.html" class="nav-item" data-role-visible="admin"><i class="fa-solid fa-user-shield"></i><span>Admin</span></a>
    </nav>
    <div class="sidebar-footer">
      <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
      <button class="nav-item nav-item-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></button>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
      <div class="topbar-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="globalSearch" placeholder="Search feedback..." />
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="notifBell" aria-label="Notifications"><i class="fa-solid fa-bell"></i><span class="badge-dot" id="notifCount">0</span></button>
        <div class="notif-dropdown" id="notifDropdown" hidden>
          <div class="notif-dropdown-header"><h4>Notifications</h4><button class="link-btn" id="clearAllNotifs">Clear all</button></div>
          <ul class="notif-list" id="notifList"></ul>
        </div>
        <div class="profile-menu">
          <button class="profile-trigger" id="profileTrigger">
            <img src="images/avatar-placeholder.png" alt="" class="avatar-sm" id="topbarAvatar" />
            <span id="topbarUserName">Loading…</span>
            <i class="fa-solid fa-chevron-down"></i>
          </button>
          <div class="profile-dropdown" id="profileDropdown" hidden>
            <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
            <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
            <button id="profileLogoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
          </div>
        </div>
      </div>
    </header>

    <main class="page-content">
      <div class="page-header">
        <div>
          <h1>Feedback</h1>
          <p class="text-muted">Structured feedback between teachers and teams.</p>
        </div>
        <button class="btn btn-primary" id="openCreateFeedbackBtn" data-role-visible="teacher"><i class="fa-solid fa-plus"></i> New Feedback</button>
      </div>

      <div class="toolbar glass-card">
        <div class="toolbar-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="search" id="feedbackSearchInput" placeholder="Search feedback..." />
        </div>
        <div class="toolbar-filters">
          <select id="feedbackProjectFilter" aria-label="Filter by project"><option value="">All projects</option></select>
          <select id="feedbackCategoryFilter" aria-label="Filter by category">
            <option value="">All categories</option>
            <option value="general">General</option>
            <option value="ui">UI</option>
            <option value="backend">Backend</option>
            <option value="documentation">Documentation</option>
            <option value="presentation">Presentation</option>
          </select>
          <select id="feedbackPriorityFilter" aria-label="Filter by priority">
            <option value="">All priorities</option>
            <option value="normal">Normal</option>
            <option value="important">Important</option>
            <option value="critical">Critical</option>
          </select>
          <select id="feedbackStatusFilter" aria-label="Filter by resolved status">
            <option value="">All</option>
            <option value="open">Open</option>
            <option value="resolved">Resolved</option>
          </select>
        </div>
      </div>

      <div class="feedback-timeline" id="feedbackTimelineFull"></div>

      <div class="empty-state" id="feedbackEmptyState" hidden>
        <i class="fa-solid fa-comments"></i>
        <h3>No feedback yet</h3>
        <p id="feedbackEmptyText">Feedback from your teacher will show up here.</p>
      </div>
    </main>
  </div>

  <!-- Create feedback modal (Teacher) -->
  <div class="modal-overlay" id="createFeedbackModal" hidden>
    <div class="modal glass-card modal-lg" role="dialog" aria-modal="true" aria-labelledby="createFeedbackTitle">
      <button class="modal-close" data-close-modal="createFeedbackModal" aria-label="Close">&times;</button>
      <h3 id="createFeedbackTitle"><i class="fa-solid fa-comment-dots"></i> New Feedback</h3>
      <form id="createFeedbackForm" class="app-form">
        <div class="form-grid-2">
          <div class="form-group">
            <label for="fbProject">Project</label>
            <select id="fbProject" required></select>
          </div>
          <div class="form-group">
            <label for="fbTask">Task (optional)</label>
            <select id="fbTask"><option value="">— Project-level feedback —</option></select>
          </div>
        </div>
        <div class="form-group">
          <label for="fbMessage">Feedback</label>
          <textarea id="fbMessage" rows="4" required placeholder="Write constructive feedback..."></textarea>
        </div>
        <div class="form-grid-2">
          <div class="form-group">
            <label for="fbCategory">Category</label>
            <select id="fbCategory">
              <option value="general">General</option>
              <option value="ui">UI</option>
              <option value="backend">Backend</option>
              <option value="documentation">Documentation</option>
              <option value="presentation">Presentation</option>
            </select>
          </div>
          <div class="form-group">
            <label for="fbPriority">Priority</label>
            <select id="fbPriority">
              <option value="normal">Normal</option>
              <option value="important">Important</option>
              <option value="critical">Critical</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Rating</label>
          <div class="star-rating" id="fbStarRating">
            <i class="fa-regular fa-star" data-star="1"></i>
            <i class="fa-regular fa-star" data-star="2"></i>
            <i class="fa-regular fa-star" data-star="3"></i>
            <i class="fa-regular fa-star" data-star="4"></i>
            <i class="fa-regular fa-star" data-star="5"></i>
          </div>
          <input type="hidden" id="fbRatingValue" value="0" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Submit Feedback</button>
      </form>
    </div>
  </div>

  <script src="js/data/storage.js"></script>
  <script src="js/data/seed.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
